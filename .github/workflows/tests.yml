# Every suite in this folder, on every push and every pull request.
#
# It runs run_tests.ps1 - the same runner, the same discovery (test_*.py), the
# same exit code - so a green tick here means what a green run on the PC means.
# The transcript (test_results.txt) is kept with the run, for when it is red.
# Four suites at a time (-Jobs 4, the runner's CPUs): every suite keeps its
# databases in a folder of its own (testdir.py) and its servers on port 0, so
# they cannot touch each other, and the transcript is still in name order.
#
# A pull request from a fork gets no secrets and needs none: every suite builds
# its own throwaway database, and nothing here talks to the live server.
#
# Beside it, a second job checks that every import is used and every name
# exists (UPGRADES.md, item 8) - a job of its own, so a stray import never
# hides how the suites went, or the other way round.

name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      # test_mail.py checks the mail settings, and a runner has no mail
      # provider: console mode is the honest setting here (codes print,
      # nothing is sent). Every other suite passes with it on or off.
      ELUSION_MAIL_CONSOLE: "1"
    steps:
      - uses: actions/checkout@v5

      # The live server runs Ubuntu 24.04, whose Python is 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run every suite
        shell: pwsh
        run: ./run_tests.ps1 -Python (Get-Command python).Source -Jobs 4

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test_results.txt
          if-no-files-found: ignore

  # flake8's pyflakes checks only (--select=F): unused imports, names that do
  # not exist, a name defined twice - no style rules. They honour the `# noqa`
  # marks the packages' __init__.py files and wsgi.py carry on purpose, where
  # an import is the export. Pinned, so a new release cannot turn it red on
  # its own.
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every import used, every name defined
        run: |
          python -m pip install flake8==7.1.1
          python -m flake8 --select=F --exclude=venv,__pycache__ .
